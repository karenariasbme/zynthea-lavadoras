*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.bar{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;min-height:62px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;color:#fff}

.tabs{display:flex;gap:2px;flex-wrap:wrap;align-self:stretch}

.tabs a:hover,.tabs a.on{color:#fff}

.cnt{background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px}
.alert{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line)}

main{max-width:1180px;margin:0 auto;padding:22px 16px 50px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px;max-width:420px}
.search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.search input:focus{outline:none;border-color:var(--fil);box-shadow:0 0 0 3px var(--fil-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}

.seg button.on{background:var(--ink);color:var(--bg)}

.btn.fil{background:var(--fil);border-color:var(--fil);color:var(--fil-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.pc.oil::before{background:var(--oil)} .pc.fil::before{background:var(--fil)}

.pc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pc h3{margin-top:2px}

.pc.low .meter div{background:var(--warn)} .pc.out .meter div{background:var(--bad)}

.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.ticket{position:sticky;top:80px}
.tl{display:flex;justify-content:space-between;gap:10px;padding:9px 0 9px 10px;border-bottom:1px dashed var(--line);font-size:14px;border-left:3px solid var(--line)}
.tl.oil{border-left-color:var(--oil)} .tl.fil{border-left-color:var(--fil)}
.tl small{display:block;color:var(--muted);font-size:12.5px}
.tl span{font-weight:600;white-space:nowrap}
.tt{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:10px;padding-top:10px;font-weight:600}
.tt b{font:700 34px "Barlow Condensed",sans-serif}

.pc-act{display:flex;gap:8px;margin-top:auto}
.pc-act .btn{flex:1;justify-content:center}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.oil{background:var(--oil-soft);color:var(--oil-text)} .tag.fil{background:var(--fil-soft);color:var(--fil-text)}
.tag.comp{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--good-soft);color:var(--good)} .st.low{background:var(--warn-soft);color:var(--warn)} .st.out{background:var(--bad-soft);color:var(--bad)}
.empty{padding:34px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.panel-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-h p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.form .s2{grid-column:span 2} .form .s3{grid-column:span 3} .form .s4{grid-column:1/-1}
label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.inp{border:1.5px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:15px;min-width:0;color:var(--ink);width:100%}
.inp:focus{outline:none;border-color:var(--fil);background:var(--surface)}
.qty{display:flex;gap:8px}
.qty>label{flex:1}
.rec{border-radius:10px;padding:12px 14px;font-size:14px}
.rec.oil{background:var(--oil-soft)} .rec.fil{background:var(--fil-soft)} .rec.none{background:var(--surface-2);color:var(--muted)}

/* Buscador desplegable (escribir para elegir) */
.cb{position:relative}
.cb input{padding-right:34px}
.cb::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.cb ul{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;list-style:none;margin:0;padding:4px;z-index:45;box-shadow:0 10px 30px rgba(15,46,68,.18)}
.cb.open ul{display:block}
.cb li{padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink);font-size:14.5px}
.cb li small{display:block;color:var(--muted);font-size:12.5px}
.cb li.act,.cb li[data-k]:hover{background:var(--fil-soft)}
.cb li.none{color:var(--muted);cursor:default}

/* Elección original / compatible */
.slot{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.slot-h{font-weight:600;font-size:14px;margin-bottom:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;background:var(--surface);flex:1;min-width:190px;font-size:14px}
.opt:has(input:checked){border-color:var(--fil);background:var(--fil-soft)}
.opt.no{flex:0 0 auto;min-width:0}
.opt input{margin-top:3px;accent-color:var(--fil)}
.opt small{display:block;color:var(--muted)}
.opt.dis{opacity:.55}
.extra{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--fil-soft);border-radius:999px;padding:5px 6px 5px 12px;font-size:13.5px}
.chip button{border:0;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--muted)}

.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}

.brand{margin-bottom:18px}
.brand h3{font-size:21px;margin:0 0 8px}
.brand .grid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.vc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vc-h b{font:600 19px "Barlow Condensed"}
.vc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13.5px}
.vc dt{color:var(--muted)}
.vc dd{margin:0;text-align:right}
.vc dd div+div{margin-top:2px}

.modal{position:fixed;inset:0;background:rgba(8,20,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .in{background:var(--surface);border-radius:14px;padding:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.modal .in h2{margin-bottom:14px}
.sub{font:600 15px "Barlow",system-ui,sans-serif;color:var(--ink);margin:6px 0 -4px}
.live{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-top:12px;gap:10px}
.live b{font:700 26px "Barlow Condensed"}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.toast.warn{background:var(--warn);color:#fff}
.muted{color:var(--muted)} .small{font-size:13px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 24px}
footer a{color:inherit}
/* Franja de la demo pública (dentro de la cabecera fija) */
.demo{background:rgba(0,0,0,.22);border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.demo .bar{min-height:auto;padding:6px 16px;gap:6px 14px}
.demo .bar>span{margin-right:auto}
.demo .acts{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.demo a{color:#fff;font-weight:600}
.demo button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:7px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer}
.demo button:hover{background:rgba(255,255,255,.1)}
@media (max-width:760px){
  .bar{gap:6px}
  .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}
  .tabs a{min-height:46px;padding:0 11px;white-space:nowrap;font-size:14px}
  .form{grid-template-columns:1fr 1fr}
  .form .s2,.form .s3{grid-column:1/-1}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 ['a1','Aceite 20W-50','Mineral','Marca A','Galón',24,8,26,8],['a2','Aceite 15W-40','Diésel','Marca A','Galón',30,10,29,9],

  Object.fromEntries(SLOTS.flatMap(([s])=>[[s,''],[s+'C','']])),o);
const DEMO_V=[
 V('Chevrolet','Aveo','a4',1,{fAceite:'f1',fAceiteC:'f10',fAire:'f5',fCabina:'f9'}),

/* ---------- Galones y cuartos ---------- */
const isGal=p=>!!p&&/gal/i.test(p.pres||'')&&!/caneca|tanque|balde/i.test(p.pres||'');
function gq(q){let g=Math.floor(q+1e-9),c=Math.round((q-g)*4);if(c===4){g++;c=0}return [g,c]}
function fmtQ(p,q,corto){
  if(isGal(p)){const [g,c]=gq(q);
    if(corto)return (g||!c?`${g} gal`:'')+(c?`${g?' + ':''}${c} ct`:'');
    return (g||!c?`${g} ${g===1?'galón':'galones'}`:'')+(c?`${g?' y ':''}${c} ${c===1?'cuarto':'cuartos'}`:'');}
  const u=p&&p.pres?p.pres.toLowerCase():'u';return `${q} ${p&&CFGkey(p)==='filtros'?(q===1?'unidad':'unidades'):u}`;
}
const CFGkey=p=>F.includes(p)?'filtros':'aceites';

const money=n=>'$'+(Math.round((n||0)*100)/100).toFixed(2);
const precioCt=p=>num(p.precioCt)||num(p.precio)/4;
function precioQ(p,q){if(!p)return 0;if(isGal(p)){const [g,c]=gq(q);return Math.round((g*num(p.precio)+c*precioCt(p))*100)/100}return Math.round(q*num(p.precio)*100)/100}
function precioTxt(p,key){if(!num(p.precio))return '<span class="muted">Sin precio</span>';
  if(key==='aceites'&&isGal(p))return `<b>${money(p.precio)}</b> el galón · <b>${money(precioCt(p))}</b> el cuarto`;
  return `<b>${money(p.precio)}</b> ${key==='filtros'?'c/u':'por '+esc((p.pres||'unidad').toLowerCase())}`}

      <label class="f">Cuartos<select class="inp" id="${id}-c">${[0,1,2,3].map(n=>`<option value="${n}" ${n===c?'selected':''}>${n}</option>`).join('')}</select></label></div>`;}

}

const CB={};
function combo(id,items,val,ph){CB[id]={items,val:val||''};const it=items.find(i=>i.v===val);
  return `<div class="cb" id="${id}"><input class="inp" autocomplete="off" placeholder="${esc(ph)}" value="${esc(it?it.t:'')}" role="combobox" aria-autocomplete="list"><ul role="listbox"></ul></div>`}
function cbInit(id,on){
  const el=document.getElementById(id);if(!el)return;const inp=el.querySelector('input'),ul=el.querySelector('ul'),st=CB[id];let act=-1,list=[];
  const draw=all=>{const q=all?'':norm(inp.value);list=st.items.filter(i=>!q||norm(i.t+' '+(i.s||'')).includes(q)).slice(0,60);act=list.length?0:-1;
    ul.innerHTML=list.length?list.map((i,k)=>`<li data-k="${k}" class="${k===0?'act':''}">${esc(i.t)}${i.s?`<small>${esc(i.s)}</small>`:''}</li>`).join(''):'<li class="none">Sin resultados</li>'};
  const pick=i=>{st.val=i.v;inp.value=i.t;el.classList.remove('open');on&&on(i.v)};
  inp.addEventListener('focus',()=>{draw(true);el.classList.add('open');inp.select()});
  inp.addEventListener('input',()=>{draw(false);el.classList.add('open');if(!inp.value.trim()&&st.val){st.val='';on&&on('')}});
  inp.addEventListener('keydown',e=>{
    if(!el.classList.contains('open')){if(e.key==='ArrowDown'){draw(true);el.classList.add('open')}return}
    const lis=ul.querySelectorAll('li[data-k]');
    if(e.key==='ArrowDown'){act=Math.min(lis.length-1,act+1);e.preventDefault()}
    else if(e.key==='ArrowUp'){act=Math.max(0,act-1);e.preventDefault()}
    else if(e.key==='Enter'){e.preventDefault();if(list[act])pick(list[act]);return}
    else if(e.key==='Escape'){el.classList.remove('open');e.stopPropagation();return}
    else if(e.key==='Tab'){if(list[act]&&inp.value.trim())pick(list[act]);return}
    lis.forEach((l,k)=>l.classList.toggle('act',k===act));if(lis[act])lis[act].scrollIntoView({block:'nearest'})});
  ul.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-k]');if(li){e.preventDefault();pick(list[+li.dataset.k])}});
  inp.addEventListener('blur',()=>setTimeout(()=>{el.classList.remove('open');const it=st.items.find(i=>i.v===st.val);inp.value=it?it.t:''},150));
}

function optHTML(slot,lab,p,checked){

function recFiltros(v){

function guardarUso(key){
  const c=CFG[key],R=c.R(),cliente=$('#u-c').value.trim(),fecha=$('#u-f').value||hoyISO();

  else{items=gatherFiltros(v);if(!items.length)return toast('Elige al menos un filtro')}
  if(!stockOk(key,items))return;
  const avisos=[];let total=0;
  items.forEach(it=>total+=addReg(key,it,{fecha,cliente,marca,modelo},avisos));

function gatherFiltros(v){const items=[];
  SLOTS.forEach(([s])=>{const r=document.querySelector(`input[name="${s}"]:checked`);if(r&&r.value)items.push([r.value,1,v&&v[s+'C']===r.value?'Compatible':'Original'])});
  EXTRA.forEach(id=>{if(!items.some(x=>x[0]===id))items.push([id,1,'Otro'])});return items}
function stockOk(key,items){const R=CFG[key].R();for(const [pid,q] of items){const p=findP(key,pid);if(q>actual(p,R)+1e-9){toast(`No alcanza: quedan ${fmtQ(p,actual(p,R))} de ${pname(p,key)}`,1);return false}}return true}
function addReg(key,[pid,q,cl],base,avisos,cambio){

function aviso(avisos,ok){avisos.length?toast(ok+'. Atención, stock bajo → '+avisos.join(' | '),1):toast(ok)}
function hist(key){

    <td><b>${p?fmtQ(p,r.qty):r.qty}</b>${r.cambio?' <span class="tag comp">Cambio</span>':''}</td><td>${r.valor!=null?money(r.valor):'-'}</td>

function guardarCambio(){

  $('#u-count').textContent=`${CA.length} cambios`;
  $('#u-hist').innerHTML=rows.length?`<table><thead><tr><th>Fecha</th><th>Cliente</th><th>Vehículo</th><th>Aceite</th><th>Filtros</th><th>Mano de obra</th><th>Total</th><th></th></tr></thead><tbody>
  ${rows.map(c=>{const ra=RA.filter(r=>r.cambio===c.id),rf=RF.filter(r=>r.cambio===c.id);
    return `<tr><td class="muted">${fdate(c.fecha)}</td><td><b>${esc(c.cliente)}</b></td><td>${c.marca?esc(c.marca+' '+c.modelo):'-'}</td>
    <td>${ra.map(r=>{const p=findP('aceites',r.pid);return p?`${esc(p.n)} · ${fmtQ(p,r.qty,1)}`:'-'}).join('<br>')}</td>
    <td class="small">${rf.map(r=>{const p=findP('filtros',r.pid);return p?`${esc(p.n.replace('Filtro de ',''))} <span class="tag comp">${esc(r.clase)}</span>`:'-'}).join('<br>')||'-'}</td>
    <td>${money(c.mo)}</td><td><b>${money(c.total)}</b></td>
    <td><button class="x" onclick="delCambio('${c.id}')" aria-label="Eliminar">×</button></td></tr>`}).join('')}</tbody></table>`
  :`<div class="empty">${q?'Sin resultados.':'Todavía no hay cambios registrados.'}</div>`;
}
function delCambio(id){confirmar('Se eliminará este cambio. El aceite y los filtros vuelven al stock.',()=>{
  RA=RA.filter(r=>r.cambio!==id);RF=RF.filter(r=>r.cambio!==id);CA=CA.filter(c=>c.id!==id);
  SAVE.regA();SAVE.regF();SAVE.cambios();route();toast('Cambio eliminado')})}
function xlsCambios(){if(!okX())return;
  bajar(CA.map(c=>{const ra=RA.filter(r=>r.cambio===c.id),rf=RF.filter(r=>r.cambio===c.id);
    return {Fecha:c.fecha,Cliente:c.cliente,Marca:c.marca,Modelo:c.modelo,
      Aceite:ra.map(r=>{const p=findP('aceites',r.pid);return p?`${p.n} ${p.tipo} (${fmtQ(p,r.qty)})`:''}).join('; '),'Valor aceite':ra.reduce((a,r)=>a+(r.valor||0),0),
      Filtros:rf.map(r=>{const p=findP('filtros',r.pid);return p?`${p.n} ${p.uso||''} [${r.clase}]`:''}).join('; '),'Valor filtros':rf.reduce((a,r)=>a+(r.valor||0),0),
      'Mano de obra':c.mo,Total:c.total}}),'Cambios de aceite','cambios_de_aceite')}

/* ---------- Excel ---------- */
function okX(){if(typeof XLSX==='undefined'){toast('No se pudo cargar Excel. Revisa tu conexión.');return false}return true}
function bajar(rows,hoja,arch){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),hoja);XLSX.writeFile(wb,`Demo_${arch}_${hoyISO()}.xlsx`)}
function xlsStock(key){if(!okX())return;const c=CFG[key],R=c.R();
  bajar(c.L().map(p=>({[c.Uno]:p.n,Tipo:p.tipo,Marca:p.marca,...(key==='aceites'?{Presentación:p.pres}:{Código:p.ref,'Para qué vehículos':p.uso}),'Stock inicial':p.ini,Entradas:p.ent,Usado:usado(R,p.id),'Stock actual':actual(p,R),'Stock (texto)':fmtQ(p,actual(p,R)),'Avisar en':p.min,Precio:num(p.precio),...(key==='aceites'?{'Precio cuarto':isGal(p)?precioCt(p):''}:{}),Estado:ESTX[estado(p,R)]})),key==='aceites'?'Aceites':'Filtros',key)}
function xlsUso(key){if(!okX())return;const c=CFG[key];
  bajar(c.R().map(r=>{const p=findP(key,r.pid);return {Fecha:r.fecha,Cliente:r.cliente,Marca:r.marca,Modelo:r.modelo,[c.Uno]:pname(p,key),...(key==='filtros'?{'Original / compatible':r.clase||''}:{}),Cantidad:r.qty,'Cantidad (texto)':p?fmtQ(p,r.qty):r.qty}}),key==='aceites'?'Aceite usado':'Filtros usados',key==='aceites'?'aceite_usado':'filtros_usados')}

/* ---------- Navegación ---------- */
function route(){
  const t=location.hash.slice(1)||'aceites';
  const P={aceites:()=>pStock('aceites'),filtros:()=>pStock('filtros'),cambios:pCambio,'uso-aceites':()=>pUso('aceites'),'uso-filtros':()=>pUso('filtros'),vehiculos:pVeh};
  nav(P[t]?t:'aceites');(P[t]||P.aceites)();
}
window.addEventListener('hashchange',()=>{cerrar();route();window.scrollTo(0,0)});
Object.values(SAVE).forEach(f=>f());
route();
</script>
</body>
</html>
