<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema para Lavadoras</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F2E44">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M0 8a8 8 0 0 1 8-8h24L0 32z%22 fill=%22%23D0911C%22/%3E%3Cpath d=%22M32 24a8 8 0 0 1-8 8H0L32 0z%22 fill=%22%233D8FD6%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<!-- URL de llegada (antes de que Supabase la limpie): trae el error si el inicio con Google se canceló o falló -->
<script>window.__urlInicial = location.href;</script>
</head>
<body>

<div id="splash" class="splash" role="status"><span class="spinner" aria-hidden="true"></span>Cargando…</div>

<!-- Pendiente, rechazado o suspendido (lo llena app.js) -->
<div id="gate" class="gate" hidden></div>

<!-- Aprobado -->
<div id="shell" hidden>
  <header class="topbar">
    <div class="bar">
      <a class="top-brand" href="#inicio">
        <span id="lavLogo"></span>
        <span class="nombre" id="lavNombre"></span>
      </a>
      <nav class="nav" id="nav" aria-label="Secciones">
        <a href="#inicio" data-route="inicio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
        <a href="#lavadora" data-route="lavadora">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Mi lavadora</span></a>
      </nav>
      <button class="btn-salir" id="logoutBtn" type="button">Salir</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>
  <footer class="app-foot"><a href="privacidad.html">Privacidad</a> · <a href="terminos.html">Términos</a> · Desarrollado por Zynthea Solutions</footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
